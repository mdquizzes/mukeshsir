function resizeCanvas(){

  const rect = board.getBoundingClientRect();

  const oldCanvas = document.createElement("canvas");
  oldCanvas.width = canvas.width;
  oldCanvas.height = canvas.height;

  if(canvas.width && canvas.height){
    oldCanvas.getContext("2d")
      .drawImage(canvas,0,0);
  }

  const ratio = window.devicePixelRatio || 1;

  canvas.width = Math.floor(rect.width * ratio);
  canvas.height = Math.floor(rect.height * ratio);

  canvas.style.width = rect.width + "px";
  canvas.style.height = rect.height + "px";

  ctx.setTransform(ratio,0,0,ratio,0,0);

  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  if(oldCanvas.width && oldCanvas.height){
    ctx.drawImage(
      oldCanvas,
      0,
      0,
      oldCanvas.width,
      oldCanvas.height,
      0,
      0,
      rect.width,
      rect.height
    );
  }
}

window.addEventListener("resize",resizeCanvas);

      y:e.touches[0].clientY - rect.top
    };

  }

  return {
    x:e.clientX - rect.left,
    y:e.clientY - rect.top
  };
}


function startDrawing(e){

  e.preventDefault();

  drawing = true;

  const p = getPosition(e);

  lastX = p.x;
  lastY = p.y;

  saveState();

  drawDot(p.x,p.y);
}


function draw(e){

  if(!drawing) return;

  e.preventDefault();

  const p = getPosition(e);

  ctx.beginPath();

  ctx.moveTo(lastX,lastY);

  ctx.lineTo(p.x,p.y);

  if(currentTool === "eraser"){

    ctx.globalCompositeOperation =
      "destination-out";

    ctx.lineWidth =
      Number(sizeInput.value) * 5;

  }else{

    ctx.globalCompositeOperation =
      "source-over";

    ctx.strokeStyle =
      colorInput.value;

    ctx.lineWidth =
      Number(sizeInput.value);

  }

  ctx.stroke();

  lastX = p.x;
  lastY = p.y;
}


function stopDrawing(){

  drawing = false;

  ctx.globalCompositeOperation =
    "source-over";
}


function drawDot(x,y){

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    currentTool === "eraser"
      ? Number(sizeInput.value)*2
      : Number(sizeInput.value)/2,
    0,
    Math.PI*2
  );

  if(currentTool === "eraser"){

    ctx.globalCompositeOperation =
      "destination-out";

    ctx.fill();

  }else{

    ctx.globalCompositeOperation =
      "source-over";

    ctx.fillStyle =
      colorInput.value;

    ctx.fill();

  }

  ctx.globalCompositeOperation =
    "source-over";
}


canvas.addEventListener(
  "mousedown",
  startDrawing
);

canvas.addEventListener(
  "mousemove",
  draw
);

window.addEventListener(
  "mouseup",
  stopDrawing
);


canvas.addEventListener(
  "touchstart",
  startDrawing,
  {passive:false}
);

canvas.addEventListener(
  "touchmove",
  draw,
  {passive:false}
);

window.addEventListener(
  "touchend",
  stopDrawing
);


/* =========================================================
   UNDO / REDO
========================================================= */

function saveState(){

  try{

    undoStack.push(
      canvas.toDataURL()
    );

    if(undoStack.length > 30){
      undoStack.shift();
    }

    redoStack = [];

  }catch(err){}

}


function restoreImage(data){

  const img = new Image();

  img.onload = function(){

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    const ratio =
      window.devicePixelRatio || 1;

    ctx.drawImage(
      img,
      0,
      0,
      canvas.width / ratio,
      canvas.height / ratio
    );

  };

  img.src = data;
}


function undo(){

  if(!undoStack.length) return;

  redoStack.push(
    canvas.toDataURL()
  );

  const previous =
    undoStack.pop();

  restoreImage(previous);
}


function redo(){

  if(!redoStack.length) return;

  undoStack.push(
    canvas.toDataURL()
  );

  const next =
    redoStack.pop();

  restoreImage(next);
}


/* =========================================================
   CLEAR BOARD
========================================================= */

function clearBoard(){

  if(!confirm("Clear the teacher whiteboard?")) return;

  saveState();

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );
}


/* =========================================================
   TOOL BUTTONS
========================================================= */

document.getElementById("ttPenBtn")
.addEventListener("click",function(){

  currentTool = "pen";

  this.classList.add("active");

  document
    .getElementById("ttEraserBtn")
    .classList.remove("active");

});


document.getElementById("ttEraserBtn")
.addEventListener("click",function(){

  currentTool = "eraser";

  this.classList.add("active");

  document
    .getElementById("ttPenBtn")
    .classList.remove("active");

});


document.getElementById("ttUndoBtn")
.addEventListener(
  "click",
  undo
);


document.getElementById("ttRedoBtn")
.addEventListener(
  "click",
  redo
);


document.getElementById("ttClearBtn")
.addEventListener(
  "click",
  clearBoard
);


document.getElementById("ttClearBoardBtn")
.addEventListener(
  "click",
  clearBoard
);


/* =========================================================
   QUESTION RENDER
========================================================= */

function renderQuestion(){

  const item =
    questions[currentIndex];

  exerciseLabel.textContent =
    "EXERCISE " + item.ex;

  counter.textContent =
    (currentIndex + 1) +
    " / " +
    questions.length;

  let html =
    "<div>" +
    "Question " +
    item.q +
    "</div>" +
    "<div class='sub'>" +
    item.text +
    "</div>";

  if(item.figure){

    html +=
      "<div class='tt-figure-box'>" +
      "<strong>📊 " +
      item.figure +
      "</strong>" +
      "Use the corresponding figure from the textbook/PDF while teaching." +
      "</div>";

  }

  question.innerHTML =
    html;

  solutionContent.innerHTML =
    item.solution ||
    "No solution has been added for this question. Use the large whiteboard area to work through the solution.";

  solution.classList.remove("show");

  document.getElementById(
    "ttShowSolutionBtn"
  ).textContent =
    "Show Solution";

  progressBar.style.width =
    ((currentIndex + 1) /
      questions.length * 100) +
    "%";

  exerciseSelect.value =
    item.ex;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   NEXT / PREVIOUS
========================================================= */

function nextQuestion(){

  if(currentIndex <
     questions.length - 1){

    currentIndex++;

    clearBoardWithoutConfirm();

    renderQuestion();

  }

}


function previousQuestion(){

  if(currentIndex > 0){

    currentIndex--;

    clearBoardWithoutConfirm();

    renderQuestion();

  }

}


function clearBoardWithoutConfirm(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  undoStack = [];
  redoStack = [];

}


document.getElementById("ttNextBtn")
.addEventListener(
  "click",
  nextQuestion
);


document.getElementById("ttPrevBtn")
.addEventListener(
  "click",
  previousQuestion
);


/* =========================================================
   EXERCISE SELECTOR
========================================================= */

exerciseSelect.addEventListener(
  "change",
  function(){

    const selected =
      this.value;

    const first =
      questions.findIndex(
        x => x.ex === selected
      );

    if(first >= 0){

      currentIndex = first;

      clearBoardWithoutConfirm();

      renderQuestion();

    }

  }
);


/* =========================================================
   SOLUTION TOGGLE
========================================================= */

document.getElementById(
  "ttShowSolutionBtn"
)
.addEventListener(
  "click",
  function(){

    solution.classList.toggle("show");

    this.textContent =
      solution.classList.contains("show")
      ? "Hide Solution"
      : "Show Solution";

  }
);


/* =========================================================
   QUESTION HIDE / SHOW
========================================================= */

document.getElementById(
  "ttQuestionToggleBtn"
)
.addEventListener(
  "click",
  function(){

    const panel =
      document.getElementById(
        "ttQuestionPanel"
      );

    if(panel.style.display === "none"){

      panel.style.display = "";

      this.textContent =
        "Hide Question";

    }else{

      panel.style.display =
        "none";

      this.textContent =
        "Show Question";

    }

  }
);


/* =========================================================
   FULLSCREEN
========================================================= */

document.getElementById(
  "ttFullscreenBtn"
)
.addEventListener(
  "click",
  function(){

    app.classList.toggle(
      "tt-fullscreen"
    );

    this.textContent =
      app.classList.contains(
        "tt-fullscreen"
      )
      ? "✕ Exit Fullscreen"
      : "⛶ Fullscreen";

    setTimeout(
      resizeCanvas,
      150
    );

  }
);


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
  "keydown",
  function(e){

    /* Do not change slide while typing */
    if(
      e.target.tagName === "INPUT" ||
      e.target.tagName === "TEXTAREA" ||
      e.target.tagName === "SELECT"
    ){
      return;
    }

    if(e.key === "ArrowRight"){

      nextQuestion();

    }

    if(e.key === "ArrowLeft"){

      previousQuestion();

    }

    if(
      e.key.toLowerCase() === "s"
    ){

      document
        .getElementById(
          "ttShowSolutionBtn"
        )
        .click();

    }

    if(e.key.toLowerCase() === "f"){

      document
        .getElementById(
          "ttFullscreenBtn"
        )
        .click();

    }

    if(e.key.toLowerCase() === "c"){

      clearBoard();

    }

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

resizeCanvas();

renderQuestion();


})();
</script>

</div>
